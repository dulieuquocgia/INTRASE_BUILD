name: INTRASE select App Store draft build
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact private source snapshot containing the draft selector
        required: true
      build_number:
        description: Exact processed INTRASE build; no App Review submission
        required: true
permissions:
  contents: read
concurrency:
  group: intrase-store-draft
  cancel-in-progress: false
jobs:
  select-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: dulieuquocgia/INTRASE
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.INTRASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify source and build input
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select draft build and verify relationship
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python -m pip install -r tools/requirements.txt
          umask 077
          KEY_PATH="$RUNNER_TEMP/intrase-asc.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          export ASC_KEY_PATH="$KEY_PATH"
          python tools/asc.py wait-build --bundle-id vn.intrase.app --build "$BUILD_NUMBER" --timeout 480
          python tools/select_store_draft.py --build "$BUILD_NUMBER"
